[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brokerage-connect"
version = "0.6.5"
description = "Unified Python interface for brokerage APIs — Schwab, SnapTrade, IBKR, Plaid"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0.3,<7"]

[project.urls]
Homepage = "https://github.com/henrysouchien/brokerage-connect"
Source = "https://github.com/henrysouchien/brokerage-connect"

[project.optional-dependencies]
schwab = ["schwab-py>=1.5,<2"]
snaptrade = ["snaptrade-python-sdk>=11.0,<12"]
ibkr = [
  "fastapi>=0.135.3,<1",
  "pydantic>=2.12.5,<3",
  "ib-async>=2.1,<3",
  "pandas>=3.0.5,<4",
  "certifi>=2026.2.25,<2027.0.0",
  "nest_asyncio>=1.6,<2",
  "pyarrow>=23.0.1,<24",
  "zstandard>=0.25.0,<1",
]
plaid = ["plaid-python>=38.0,<39", "certifi>=2026.2.25,<2027.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["brokerage"]

[tool.hatch.build.targets.sdist]
include = ["brokerage/", "pyproject.toml", "README.md", "LICENSE"]
