# IBKR exchange code -> ISO MIC mapping for equity suffix resolution
ibkr_exchange_to_mic:
  # Execution venues
  LSEETF: XLON
  AEB: XAMS
  SBF: XPAR
  IBIS: XETR
  VIRTX: XSWX
  BVME: XMIL
  TSE: XTSE
  ASX: XASX
  # Listing exchanges. The updatePortfolio stream reports the listing venue in
  # primaryExchange (execution `exchange` is blank there), so these codes carry
  # every portfolio row — US listings included.
  LSE: XLON
  NYSE: XNYS
  NASDAQ: XNAS
  ISLAND: XNAS      # legacy IBKR code for NASDAQ
  ARCA: ARCX
  AMEX: XASE
  BATS: BATS
  IEX: IEXG
  PINK: OOTC        # OTC Markets
  OTCM: OOTC        # OTC Markets, alternate code seen on stored rows

