[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brokerage-connect"
version = "0.2.1"
description = "Unified Python interface for brokerage APIs — Schwab, SnapTrade, IBKR, Plaid"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/henrysouchien/brokerage-connect"
Source = "https://github.com/henrysouchien/brokerage-connect"

[project.optional-dependencies]
schwab = ["schwab-py>=1.5,<2"]
snaptrade = ["snaptrade-python-sdk>=11.0,<12", "boto3>=1.42,<2", "botocore>=1.42,<2"]
ibkr = ["ib-async>=2.1,<3"]
plaid = ["plaid-python>=38.0,<39", "certifi>=2024.0.0", "boto3>=1.42,<2", "botocore>=1.42,<2"]

[tool.hatch.build.targets.wheel]
packages = ["brokerage"]

[tool.hatch.build.targets.sdist]
include = ["brokerage/", "pyproject.toml", "README.md", "LICENSE"]
